an x="144.5" dy="17">evals · parallel runs</tspan><tspan x="144.5" dy="17">deploy gateway · rollback</tspan></text></g><g class="cDM="><g class="shape" ><rect x="17" y="801" width="256" height="114" stroke="#0D32B2" fill="#ffebee" class=" stroke-B1" style="stroke-width:2;" /></g><text x="145" y="839.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="145" dy="0">PHASE 3</tspan><tspan x="145" dy="17.25">Closed loop</tspan><tspan x="145" dy="17.25">bands → diagnose → intent</tspan><tspan x="145" dy="17.25">confidence gates · chat bridge</tspan></text></g><g class="cDQ="><g class="shape" ><rect x="11" y="1052" width="268" height="130" stroke="#0D32B2" fill="#f3e5f5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="145" y="1090.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="145" dy="0">PHASE 4</tspan><tspan x="145" dy="17">Client-ready</tspan><tspan x="145" dy="17">packaged install · auth/RBAC</tspan><tspan x="145" dy="17">read-only egress · secret-free CI</tspan><tspan x="145" dy="17">outside-reporter intake</tspan></text></g><g class="KHAwIC0mZ3Q7IHAxKVswXQ=="><marker id="mk-d2-1350136727-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 144.5 131.5 C 144.5 184.699997 144.5 212.300003 144.5 263.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1350136727-3488378134)" mask="url(#d2-1350136727)" /><text x="144.5" y="196" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="144.5" dy="0">steps survive failure;</tspan><tspan x="144.5" dy="18.5">resume with no pod held</tspan></text></g><g class="KHAxIC0mZ3Q7IHAyKVswXQ=="><path d="M 144.5 398.5 C 144.5 451.700012 144.5 479.299988 144.5