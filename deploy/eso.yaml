apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory8-sandbox-settings
  namespace: factory8-sandboxes
spec:
  dataFrom:
  - extract:
      key: apps/factory8-sandbox
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: factory8-sandbox
---
# Postgres's POSTGRES_PASSWORD; Temporal reads it too (M1 design D4)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-settings
  namespace: factory8
spec:
  dataFrom:
  - extract:
      key: apps/factory8-postgres
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: postgres
---
# The cluster's root CA, so Temporal's UI trusts id.libre.pod (deploy/web.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: step-certificates-certs
  namespace: factory8
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: step-certificates-certs
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: root_ca.crt
      remoteRef:
        key: apps/step-ca
        property: root_ca.crt
