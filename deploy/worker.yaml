# The Temporal worker (M1 design D2, D4, D8). It manages sandboxes in factory8-sandboxes and holds no GitHub token.
# Both image tags are Nix hashes: after `nix build .#worker-image` or `.#sandbox-image`, import the image and update its tag here.
# Upgrading a cluster installed with the old f8-* names: follow deploy/rename-cutover.md first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory8-worker
  namespace: factory8
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory8-worker
  namespace: factory8-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory8-worker
  namespace: factory8-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory8-worker
subjects:
  - kind: ServiceAccount
    name: factory8-worker
    namespace: factory8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory8-worker
  namespace: factory8
spec:
  # 0 until a repo is added to FACTORY8_IMAGES: a worker with no repo fails at start, and factory8/factory8 has its
  # own worker (deploy/projects/factory8.yaml, M7 design D7).
  replicas: 0
  selector: { matchLabels: { app: factory8-worker } }
  template:
    metadata: { labels: { app: factory8-worker } }
    spec:
      serviceAccountName: factory8-worker
      containers:
        - name: worker
          image: factory8-worker:w6bv0pmnwjxy42bdx747zmm7mxp2hnqd
          imagePullPolicy: Never
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: FACTORY8_MODEL
              value: glm-5.3
            - name: FACTORY8_REVIEW_MODEL
              value: glm-5.3
            - name: FACTORY8_IMAGES
              value: '{}'
            - name: FACTORY8_PLUGIN
              value: https://github.com/factory8/factory8
            - name: FACTORY8_BANDS
              value: >-
                {"design": {"model": "glm-5.3", "effort": "high"},
                "acceptance": {"model": "glm-5.3", "effort": "high"},
                "implement": [{"model": "glm-5.3", "effort": "medium"}, {"model": "glm-5.3", "effort": "high"}],
                "review": {"model": "glm-5.3", "effort": "high"},
                "diagnose": {"model": "glm-5.3", "effort": "high"},
                "finish": {"model": "glm-5.3-flash"}}
