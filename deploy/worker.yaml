# The Temporal worker (M1 design D2, D4, D8). It manages sandboxes in f8-sandboxes and holds no GitHub token.
# Both image tags are Nix hashes: after `nix build .#worker-image` or `.#sandbox-image`, import the image and update its tag here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: f8-worker
  namespace: factory8
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: f8-worker
  namespace: f8-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: f8-worker
  namespace: f8-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: f8-worker
subjects:
  - kind: ServiceAccount
    name: f8-worker
    namespace: factory8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f8-worker
  namespace: factory8
spec:
  replicas: 1
  selector: { matchLabels: { app: f8-worker } }
  template:
    metadata: { labels: { app: f8-worker } }
    spec:
      serviceAccountName: f8-worker
      containers:
        - name: worker
          image: factory8-worker:q453np63kr8a7ap04rf23pkw4rinkzzl
          imagePullPolicy: Never
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend:7233
            - name: F8_MODEL
              value: glm-5.3
            - name: F8_IMAGES
              value: '{"https://github.com/factory8/factory8": "factory8-sandbox:zqwxsvfk7bhzz2nl6w85nkqfi8ipzk9f"}'
