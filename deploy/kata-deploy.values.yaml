# Kata Containers (M1 design D4). Install, or upgrade, by hand:
#   helm upgrade --install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version 4.3.1 -n kata-containers --create-namespace -f deploy/kata-deploy.values.yaml
# It restarts k3s once. RuntimeClass `kata` uses the qemu-runtime-rs shim.
deploymentMode: daemonset
k8sDistribution: k3s
runtimeClasses:
  createDefault: true
shims:
  disableAll: true
  qemu:
    enabled: true
  qemu-runtime-rs:
    enabled: true
snapshotter:
  setup: []
