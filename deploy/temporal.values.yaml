# Temporal (M1 design D4), Postgres for both stores:
# helm upgrade --install temporal temporal/temporal --version 1.7.0 -n factory8 -f deploy/temporal.values.yaml
server:
  config:
    persistence:
      numHistoryShards: 4 # can't be changed after the first install
      datastores:
        default:
          sql: &sql
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: postgres:5432
            connectProtocol: tcp
            user: postgres
            existingSecret: postgres
            secretKey: POSTGRES_PASSWORD
        visibility:
          sql:
            <<: *sql
            databaseName: temporal_visibility
    namespaces:
      create: true # the worker's namespace, `default`
