span><tspan x="139.5" dy="17">route rules · escalation · patterns</tspan><tspan x="139.5" dy="17">evals · parallel runs</tspan><tspan x="139.5" dy="17">deploy gateway · rollback</tspan></text></g><g class="cDM="><g class="shape" ><rect x="12" y="817" width="256" height="114" stroke="#0D32B2" fill="#ffebee" class=" stroke-B1" style="stroke-width:2;" /></g><text x="140" y="855.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="140" dy="0">PHASE 3</tspan><tspan x="140" dy="17.25">Closed loop</tspan><tspan x="140" dy="17.25">bands → diagnose → intent</tspan><tspan x="140" dy="17.25">confidence gates · chat bridge</tspan></text></g><g class="cDQ="><g class="shape" ><rect x="6" y="1068" width="268" height="130" stroke="#0D32B2" fill="#f3e5f5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="140" y="1106.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="140" dy="0">PHASE 4</tspan><tspan x="140" dy="17">Client-ready</tspan><tspan x="140" dy="17">packaged install · auth/RBAC</tspan><tspan x="140" dy="17">read-only egress · secret-free CI</tspan><tspan x="140" dy="17">outside-reporter intake</tspan></text></g><g class="KHAwIC0mZ3Q7IHAxKVswXQ=="><marker id="mk-d2-1432388958-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 139.5 147.5 C 139.5 200.699997 139.5 228.300003 139.5 279.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1432388958-3488378134)" mask="url(#d2-1432388958)" /><text x="139.5" y="212" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="139.5" dy="0">steps survive failure;</tspan><tspan x="139.5" dy="18.5">resume with no pod held</tspan></text></g><g class="KHAxIC0mZ3Q7IHAyKVswXQ=="><path d="M 139.5 414.5 C 139.5 467.700012 139.5 495.299988 139.5 546.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1432388958-3488378134)" mask="url(#d2-1432388958)" /><text x="139.5" y="479" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="139.5" dy="0">issue → merged PR,</tspan><tspan x="139.5" dy="18.5">humans at every gate, 2 vendors</tspan></text></g><g class="KHAyIC0mZ3Q7IHAzKVswXQ=="><path d="M 139.5 681.5 C 139.5 734.700012 139.5 762.299988 139.5 813.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1432388958-3488378134)" mask="url(#d2-1432388958)" /><text x="140" y="746" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="140" dy="0">routine change: humans</tspan><tspan x="140" dy="18.5">only at intent + release</tspan></text></g><g class="KHAzIC0mZ3Q7IHA0KVswXQ=="><path d="M 139.5 932.5 C 139.5 985.700012 139.5 1013.299988 139.5 1064.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1432388958-3488378134)" mask="url(#d2-1432388958)" /><text x="139.5" y="997" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="139.5" dy="0">breach → triaged intent</tspan><tspan x="139.5" dy="18.5">with no human starting it</tspan></text></g><mask id="d2-1432388958" maskUnits="userSpaceOnUse" x="-101" y="-101" width="481" height="1400">
