<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M7 Project Workflows</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · M7 design</p>
    <h1>Workflows a project owns, on its own worker</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m7-project-workflows-title m7-project-workflows-desc">
        <title id="m7-project-workflows-title">Workflows a project owns, on its own worker</title>
        <desc id="m7-project-workflows-desc">f8 starts every flow on the repo's own queue; the shared worker serves the queues of repos without flows of their own, and a project worker built from the project's repo serves its queue with the built-in flows plus its own, all on Factory8's unchanged activities and sandboxes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: Temporal -->
        <rect x="320" y="136" width="280" height="376" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="420" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="149" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEMPORAL</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- f8 → factory8 queue -->
        <path d="M240,324 H272 Q280,324 280,316 V212 Q280,204 288,204 H352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="288" y="252" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="310" y="261" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPO A</text>

        <!-- f8 → project queue -->
        <path d="M240,348 H272 Q280,348 280,356 V436 Q280,444 288,444 H352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="288" y="372" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="310" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPO B</text>

        <!-- queues → workers -->
        <line x1="568" y1="204" x2="680" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="568" y1="444" x2="680" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- shared worker → sandboxes -->
        <path d="M920,204 H1112 Q1120,204 1120,212 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="986" y="184" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1016" y="193" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVITIES</text>

        <!-- project worker → sandboxes -->
        <path d="M920,444 H1112 Q1120,444 1120,436 V384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="986" y="424" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1016" y="433" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVITIES</text>

        <!-- project repo → project worker (the new path) -->
        <line x1="800" y1="568" x2="800" y2="482" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="810" y="518" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="527" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NIX BUILD</text>

        <!-- Nodes -->
        <!-- f8 CLI (input) -->
        <rect x="40" y="300" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="300" width="200" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="306" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="315" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="140" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">f8 run --flow &lt;name&gt;</text>
        <text x="140" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every flow → the repo's queue</text>

        <!-- factory8 queue (store) -->
        <rect x="352" y="168" width="216" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="352" y="168" width="216" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="360" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="378" y="183" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
        <text x="460" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">factory8/&lt;owner&gt;/&lt;repo-a&gt;</text>
        <text x="460" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repo with no flows of its own</text>

        <!-- project queue (store) -->
        <rect x="352" y="408" width="216" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="352" y="408" width="216" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="360" y="414" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="378" y="423" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
        <text x="460" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">factory8/&lt;owner&gt;/&lt;repo-b&gt;</text>
        <text x="460" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repo with its own flows</text>

        <!-- shared worker (backend) -->
        <rect x="680" y="168" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="168" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="688" y="174" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="708" y="183" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="800" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Shared worker</text>
        <text x="800" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sdlc · ship · a queue per repo</text>

        <!-- project worker (focal) -->
        <rect x="680" y="408" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="408" width="240" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="688" y="414" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="708" y="423" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="800" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Project worker</text>
        <text x="800" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sdlc · ship · its own flows</text>

        <!-- sandboxes (backend) -->
        <rect x="1000" y="288" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="288" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1008" y="294" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1024" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KATA</text>
        <text x="1120" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Sandbox per step</text>
        <text x="1120" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">f8-adapter · unchanged</text>

        <!-- project repo (external) -->
        <rect x="680" y="568" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="568" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="688" y="574" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="702" y="583" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
        <text x="800" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Project repo</text>
        <text x="800" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workflows/ · flake → lib.workerImage</text>

        <!-- Callouts -->
        <text x="40" y="416" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">No worker polls the queue?</text>
        <text x="40" y="436" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">f8 refuses to start the run.</text>
        <text x="688" y="320" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">Each repo is in exactly one worker's</text>
        <text x="688" y="340" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">FACTORY8_IMAGES: one owner per queue.</text>

        <!-- Legend -->
        <line x1="30" y1="660" x2="1250" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="110" y="674" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="134" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">new in M7</text>

        <rect x="250" y="674" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="274" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">runtime</text>

        <rect x="370" y="674" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="394" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">task queue</text>

        <rect x="510" y="674" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="534" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">engineer</text>

        <rect x="630" y="674" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="654" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">project-owned source</text>

        <line x1="820" y1="680" x2="852" y2="680" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="862" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">image build</text>

        <line x1="980" y1="680" x2="1012" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="1022" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">runtime call</text>
      </svg>
    </div>
  </div>
</body>
</html>
