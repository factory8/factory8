<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M8 Sessions Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · M8 proposal</p>
    <h1>Read every session, answer from the phone</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m8-sessions-viewer-title m8-sessions-viewer-desc">
        <title id="m8-sessions-viewer-title">Read every session, answer from the phone</title>
        <desc id="m8-sessions-viewer-desc">A third-party viewer reads every step's session read-only from the run volumes, which sandboxes fill from a checkout named by the repo's workdir; a Collie inbox polls Temporal for runs waiting on a question, pushes it to the engineer's phone through Collie with a link to the session, and signals the reply back as the run's one answer.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: pilot cluster -->
        <rect x="280" y="120" width="936" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="700" y="124" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="748" y="133" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PILOT CLUSTER</text>

        <!-- Arrows (drawn before nodes); each points from the caller -->
        <!-- Collie → phone -->
        <path d="M304,188 H140 Q132,188 132,196 V284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="204" y="168" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="222" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

        <!-- phone → Collie -->
        <path d="M224,308 H336 Q344,308 344,300 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="352" y="256" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="265" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLY</text>

        <!-- phone → viewer -->
        <path d="M224,332 H368 Q376,332 376,340 V416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="384" y="372" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPENS LINK</text>

        <!-- Collie → inbox -->
        <line x1="528" y1="188" x2="624" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="536" y="168" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASKS · REPLIES</text>

        <!-- inbox → ship run -->
        <line x1="848" y1="188" x2="952" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="860" y="168" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY · SIGNAL</text>

        <!-- inbox → run volumes -->
        <line x1="736" y1="224" x2="736" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="744" y="314" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="776" y="323" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION ID</text>

        <!-- viewer → run volumes -->
        <line x1="528" y1="452" x2="624" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="544" y="432" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="441" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>

        <!-- sandbox → run volumes -->
        <line x1="952" y1="452" x2="848" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="868" y="432" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="900" y="441" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">*.JSONL</text>

        <!-- ship run → sandbox -->
        <line x1="1072" y1="224" x2="1072" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1080" y="314" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1120" y="323" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">START · ANSWER</text>

        <!-- sandbox → repo -->
        <line x1="1072" y1="488" x2="1072" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="1080" y="518" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1100" y="527"fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLONE</text>

        <!-- Nodes -->
        <!-- engineer's phone (input) -->
        <rect x="40" y="284" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="284" width="184" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="290" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="66" y="299" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PHONE</text>
        <text x="132" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Engineer's phone</text>
        <text x="132" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Collie app · browser</text>

        <!-- Collie (external) -->
        <rect x="304" y="152" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="152" width="224" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="312" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="326" y="167" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PWA</text>
        <text x="416" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Collie</text>
        <text x="416" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the user's, unchanged</text>

        <!-- session viewer (focal) -->
        <rect x="304" y="416" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="416" width="224" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="312" y="422" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="326" y="431" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="416" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Session viewer</text>
        <text x="416" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agentsview or cchv · token</text>

        <!-- Collie inbox (focal) -->
        <rect x="624" y="152" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="152" width="224" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="632" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="646" y="167" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="736" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Collie inbox</text>
        <text x="736" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">inbox/ · polls every 10 s</text>

        <!-- run volumes (store) -->
        <rect x="624" y="416" width="224" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="624" y="416" width="224" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="632" y="422" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="646" y="431" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NFS</text>
        <text x="736" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Run volumes</text>
        <text x="736" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a directory per step's PVC</text>

        <!-- ship run (runtime) -->
        <rect x="952" y="152" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="952" y="152" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="960" y="158" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="986" y="167" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEMPORAL</text>
        <text x="1072" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Ship run</text>
        <text x="1072" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state.question · answer</text>

        <!-- sandbox per step (runtime) -->
        <rect x="952" y="416" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="952" y="416" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="960" y="422" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="976" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KATA</text>
        <text x="1072" y="454" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Sandbox per step</text>
        <text x="1072" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cwd /f8/&lt;owner&gt;/&lt;repo&gt;</text>

        <!-- repo (external) -->
        <rect x="952" y="560" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="952" y="560" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="960" y="566" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="974" y="575" fill="rgba(45,49,66,0.7)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
        <text x="1072" y="596" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, sans-serif" text-anchor="middle">Repo, default branch</text>
        <text x="1072" y="612" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.factory8/project.yaml</text>

        <!-- Callouts -->
        <text x="952" y="76" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">A question takes one answer: a second,</text>
        <text x="952" y="96" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">from Collie or f8 answer, is dropped.</text>
        <text x="624" y="572" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">The checkout is named by workdir,</text>
        <text x="624" y="592" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">or else by the repo URL, so the viewer</text>
        <text x="624" y="612" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">groups every session by repo.</text>

        <!-- Legend -->
        <line x1="30" y1="660" x2="1250" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="110" y="674" width="16" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="134" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">new in M8</text>

        <rect x="250" y="674" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="274" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Factory8 runtime</text>

        <rect x="430" y="674" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="454" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">volume</text>

        <rect x="540" y="674" width="16" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="564" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">engineer</text>

        <rect x="660" y="674" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="684" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">outside Factory8</text>

        <line x1="850" y1="680" x2="882" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="892" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">call, from the caller</text>
      </svg>
    </div>
  </div>
</body>
</html>
